name: Data Pipeline 2
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: sql-integration
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.6'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libpq-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r continente_price_tracker/requirements.txt
      - name: Create .env file
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> continente_price_tracker/.env
          echo "USER=${{ secrets.USER }}" >> continente_price_tracker/.env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> continente_price_tracker/.env
          echo "HOST=${{ secrets.HOST }}" >> continente_price_tracker/.env
          echo "TYPE=${{ secrets.TYPE }}" >> continente_price_tracker/.env
          echo "PROJECT_ID=${{ secrets.PROJECT_ID }}" >> continente_price_tracker/.env
          echo "PRIVATE_KEY_ID=${{ secrets.PRIVATE_KEY_ID }}" >> continente_price_tracker/.env
          echo "PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}" >> continente_price_tracker/.env
          echo "CLIENT_EMAIL=${{ secrets.CLIENT_EMAIL }}" >> continente_price_tracker/.env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> continente_price_tracker/.env
          echo "AUTH_URI=${{ secrets.AUTH_URI }}" >> continente_price_tracker/.env
          echo "TOKEN_URI=${{ secrets.TOKEN_URI }}" >> continente_price_tracker/.env
          echo "AUTH_PROVIDER_X509_CERT_URL=${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}" >> continente_price_tracker/.env
          echo "CLIENT_X509_CERT_URL=${{ secrets.CLIENT_X509_CERT_URL }}" >> continente_price_tracker/.env
          echo "UNIVERSE_DOMAIN=${{ secrets.UNIVERSE_DOMAIN }}" >> continente_price_tracker/.env
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> continente_price_tracker/.env
          echo "GCP_REGION=${{ secrets.GCP_REGION }}" >> continente_price_tracker/.env
          echo "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" >> continente_price_tracker/.env
          echo "GCS_SUBFOLDER_PATH=${{ secrets.GCS_SUBFOLDER_PATH }}" >> continente_price_tracker/.env
          echo "SUPABASE_ACCESS_KEY_ID=${{ secrets.SUPABASE_ACCESS_KEY_ID }}" >> continente_price_tracker/.env
          echo "SUPABASE_SECRET_ACCESS_KEY=${{ secrets.SUPABASE_SECRET_ACCESS_KEY }}" >> continente_price_tracker/.env
          echo "SUPABASE_ENDPOINT=${{ secrets.SUPABASE_ENDPOINT }}" >> continente_price_tracker/.env
          echo "SUPABASE_REGION=${{ secrets.SUPABASE_REGION }}" >> continente_price_tracker/.env
          echo "SUPABASE_BUCKET_NAME=${{ secrets.SUPABASE_BUCKET_NAME }}" >> continente_price_tracker/.env
          echo "B2_KEY_ID=${{ secrets.B2_KEY_ID }}" >> continente_price_tracker/.env
          echo "B2_PASSWORD=${{ secrets.B2_PASSWORD }}" >> continente_price_tracker/.env
          echo "B2_BUCKET=${{ secrets.B2_BUCKET }}" >> continente_price_tracker/.env
          echo "PREFECT_RESULTS_PERSISTENCE_STORAGE_BLOCK_BUCKET_PATH=${{ secrets.PREFECT_RESULTS_PERSISTENCE_STORAGE_BLOCK_BUCKET_PATH }}" >> .env
      
  
          # --- Prefect Configuration (Tells the client running here where the API server is) ---
          echo "PREFECT_API_URL=${{ secrets.PREFECT_API_URL }}" >> continente_price_tracker/.env
          echo "PREFECT_API_KEY=${{ secrets.PREFECT_API_KEY }}" >> continente_price_tracker/.env
      - name: Run data pipeline and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB }}
        run: |
          python continente_price_tracker/src/object_storage/main.py